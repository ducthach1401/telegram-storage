version: "3.8"

services:
  app:
    image: node:22-alpine
    restart: always
    command: /bin/sh -c "npm install && npm run start:dev"
    working_dir: /app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - mysql
      - redis
      - minio
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  mysql:
    image: mysql:8.4
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768m

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

volumes:
  mysql_data:
  minio_data:
