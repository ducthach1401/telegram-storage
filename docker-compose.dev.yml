version: "3.8"

services:
  app:
    image: node:22-alpine
    restart: always
    command: /bin/sh -c "npm install && npm run start:dev"
    working_dir: /app
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    volumes:
      - .:/app

  mysql:
    image: mysql:8.4
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PUBLISH_PORT}:3306"

volumes:
  mysql_data:
