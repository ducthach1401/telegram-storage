version: "3.8"

services:
  app:
    image: node:22-alpine
    restart: always
    command: /bin/sh -c "npm install && npm run start:dev"
    working_dir: /app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - mysql
      - redis
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  mysql:
    image: mysql:8.4
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768m

volumes:
  mysql_data:
