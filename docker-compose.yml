version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
      - minio
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  mysql:
    image: mysql:8.4
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # S3-compatible (RustFS) thay MinIO — giữ tên service `minio` để MINIO_ENDPOINT=http://minio:9000 không đổi.
  minio:
    image: rustfs/rustfs:1.0.4
    restart: always
    env_file:
      - .env
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

volumes:
  mysql_data:
  rustfs_data:
